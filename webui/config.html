<html>
<head><title>Google Suite</title></head>
<body>
    <div x-data="{ activeTab: 'auth', authStatus: 'Checking...', authStatusBg: '#f5f5f5', authStatusColor: '#888', scopeList: 'Loading...', uploadStatus: '', uploadStatusColor: '', codeStatus: '', codeStatusColor: '', authUrlVisible: false, authUrl: '', credsJson: '', authCode: '' }" x-init="
        if (!config.services) config.services = {};
        if (!config.services.gmail) config.services.gmail = {};
        if (!config.services.calendar) config.services.calendar = {};
        if (!config.services.drive) config.services.drive = {};
        if (!config.services.contacts) config.services.contacts = {};
        if (!config.services.tasks) config.services.tasks = {};
        if (!config.services.sheets) config.services.sheets = {};
        if (config.services.gmail.enabled === undefined) config.services.gmail.enabled = true;
        if (config.services.calendar.enabled === undefined) config.services.calendar.enabled = true;
        if (config.services.drive.enabled === undefined) config.services.drive.enabled = true;
        if (config.services.contacts.enabled === undefined) config.services.contacts.enabled = false;
        if (config.services.tasks.enabled === undefined) config.services.tasks.enabled = false;
        if (config.services.sheets.enabled === undefined) config.services.sheets.enabled = false;
        if (!config.gmail) config.gmail = {};
        if (!config.gmail.max_results) config.gmail.max_results = 20;
        if (config.gmail.include_spam_trash === undefined) config.gmail.include_spam_trash = false;
        if (config.gmail.exclude_labels === undefined) config.gmail.exclude_labels = [];
        if (!config.calendar) config.calendar = {};
        if (!config.calendar.timezone) config.calendar.timezone = 'America/New_York';
        if (!config.calendar.calendar_id) config.calendar.calendar_id = 'primary';
        if (!config.calendar.max_results) config.calendar.max_results = 10;
        if (!config.calendar.default_duration_minutes) config.calendar.default_duration_minutes = 60;
        if (!config.drive) config.drive = {};
        if (!config.drive.default_folder) config.drive.default_folder = '';
        if (!config.drive.max_upload_mb) config.drive.max_upload_mb = 100;
        if (!config.memory) config.memory = {};
        if (config.memory.auto_save === undefined) config.memory.auto_save = true;
        if (!config.memory.export_format) config.memory.export_format = 'markdown';
        if (!config.security) config.security = {};
        if (!config.security.max_attachment_size_mb) config.security.max_attachment_size_mb = 25;
        if (!config.security.max_attendees) config.security.max_attendees = 50;
        if (config.security.allowed_recipients === undefined) config.security.allowed_recipients = [];
        if (config.security.allowed_calendars === undefined) config.security.allowed_calendars = [];
        if (config.security.sanitize_content === undefined) config.security.sanitize_content = true;

        /* Load auth status from API (read-only, not part of config) */
        (globalThis.fetchApi || fetch)('/api/plugins/google/google_config_api', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: 'get'})
        }).then(r => r.json()).then(c => {
            if (c._auth_status?.authenticated) {
                authStatus = 'Connected as ' + c._auth_status.email;
                authStatusBg = '#e8f5e9'; authStatusColor = '#2e7d32';
            } else {
                authStatus = c._has_credentials ? 'Not authorized' : 'No credentials';
                authStatusBg = '#fce4ec'; authStatusColor = '#c62828';
            }
            scopeList = (c._enabled_services || []).length ? c._enabled_services.join(', ') : 'None enabled';
        }).catch(() => { authStatus = 'Error loading status'; authStatusBg = '#fce4ec'; authStatusColor = '#c62828'; });
    ">
        <template x-if="config">
            <div>
                <!-- Tab Navigation -->
                <div style="display: flex; gap: 0; border-bottom: 2px solid var(--border-color, #e0e0e0); margin-bottom: 16px;">
                    <template x-for="tab in ['auth', 'services', 'gmail', 'calendar', 'drive', 'security']">
                        <button @click="activeTab = tab"
                            :style="'padding: 8px 16px; border: none; background: none; cursor: pointer; font-size: 12px; font-weight: 600; margin-bottom: -2px; color: ' + (activeTab === tab ? '#4285f4' : 'var(--text-secondary, #888)') + '; border-bottom: 2px solid ' + (activeTab === tab ? '#4285f4' : 'transparent')"
                            x-text="tab.charAt(0).toUpperCase() + tab.slice(1)"></button>
                    </template>
                </div>

                <!-- Auth Tab -->
                <div x-show="activeTab === 'auth'">
                    <div class="section-title">OAuth2 Authentication</div>
                    <div class="section-description">
                        Set up Google Cloud OAuth2 credentials to connect your Google account.
                        <a href="https://github.com/spinnakergit/a0-google/blob/main/docs/SETUP_GOOGLE.md" target="_blank" style="color: #4285f4;">Setup Guide</a>
                    </div>
                    <div class="section-description">
                        <span style="font-weight: 500;">Status:</span>
                        <span :style="'padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; background: ' + authStatusBg + '; color: ' + authStatusColor" x-text="authStatus"></span>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Step 1: Upload credentials.json</div>
                            <div class="field-description">Download OAuth client credentials from Google Cloud Console > APIs & Services > Credentials.</div>
                        </div>
                        <div class="field-control">
                            <textarea rows="4" x-model="credsJson" placeholder="Paste the contents of your credentials.json file here..."
                                style="font-family: monospace; font-size: 11px;"></textarea>
                            <div style="display: flex; gap: 6px; align-items: center; margin-top: 4px;">
                                <button class="btn btn-field" @click="
                                    if (!credsJson.trim()) { uploadStatus = 'Paste credentials.json first'; uploadStatusColor = '#c62828'; return; }
                                    (globalThis.fetchApi || fetch)('/api/plugins/google/google_config_api', {
                                        method: 'POST',
                                        headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify({action: 'upload_credentials', credentials: credsJson})
                                    }).then(r => r.json()).then(d => {
                                        if (d.ok) { uploadStatus = 'Uploaded!'; uploadStatusColor = '#2e7d32'; credsJson = ''; }
                                        else { uploadStatus = d.error || 'Upload failed'; uploadStatusColor = '#c62828'; }
                                        setTimeout(() => uploadStatus = '', 5000);
                                    }).catch(e => { uploadStatus = 'Error: ' + e.message; uploadStatusColor = '#c62828'; });
                                ">Upload Credentials</button>
                                <span :style="'font-size: 11px; color: ' + uploadStatusColor" x-text="uploadStatus"></span>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Step 2: Authorize</div>
                            <div class="field-description">Click to generate an OAuth authorization URL, then open it in your browser.</div>
                        </div>
                        <div class="field-control">
                            <button class="btn btn-field" @click="
                                (globalThis.fetchApi || fetch)('/api/plugins/google/google_config_api', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({action: 'auth_url'})
                                }).then(r => r.json()).then(d => {
                                    if (d.ok && d.auth_url) { authUrl = d.auth_url; authUrlVisible = true; }
                                    else { alert(d.error || 'Failed to generate auth URL'); }
                                }).catch(e => alert('Error: ' + e.message));
                            ">Get Authorization URL</button>
                            <div x-show="authUrlVisible" style="margin-top: 8px; padding: 8px; background: var(--bg-secondary, #f5f5f5); border-radius: 4px;">
                                <div style="font-size: 10px; color: var(--text-secondary, #888); margin-bottom: 4px;">Open this URL in your browser and authorize:</div>
                                <input type="text" :value="authUrl" readonly style="font-family: monospace; font-size: 10px;">
                                <button class="btn btn-field" style="margin-top: 4px;" @click="
                                    navigator.clipboard.writeText(authUrl).then(() => {
                                        $event.target.textContent = 'Copied!';
                                        setTimeout(() => $event.target.textContent = 'Copy URL', 2000);
                                    });
                                ">Copy URL</button>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Step 3: Enter Authorization Code</div>
                            <div class="field-description">Paste the code from the Google authorization page.</div>
                        </div>
                        <div class="field-control" style="display: flex; gap: 6px; align-items: center;">
                            <input type="text" x-model="authCode" placeholder="Paste authorization code here"
                                style="font-family: monospace; flex: 1;">
                            <button class="btn btn-field" @click="
                                if (!authCode.trim()) { codeStatus = 'Enter the authorization code'; codeStatusColor = '#c62828'; return; }
                                codeStatus = 'Authenticating...'; codeStatusColor = '#e65100';
                                (globalThis.fetchApi || fetch)('/api/plugins/google/google_config_api', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({action: 'auth_callback', code: authCode.trim()})
                                }).then(r => r.json()).then(d => {
                                    if (d.ok) {
                                        codeStatus = 'Authenticated as ' + d.email; codeStatusColor = '#2e7d32';
                                        authCode = '';
                                        authStatus = 'Connected as ' + d.email; authStatusBg = '#e8f5e9'; authStatusColor = '#2e7d32';
                                    } else { codeStatus = d.error || 'Auth failed'; codeStatusColor = '#c62828'; }
                                }).catch(e => { codeStatus = 'Error: ' + e.message; codeStatusColor = '#c62828'; });
                            ">Submit Code</button>
                        </div>
                        <span :style="'font-size: 11px; color: ' + codeStatusColor" x-text="codeStatus"></span>
                    </div>

                    <div class="section-title">Active Scopes</div>
                    <div class="section-description" style="font-family: monospace;" x-text="scopeList"></div>
                </div>

                <!-- Services Tab -->
                <div x-show="activeTab === 'services'">
                    <div class="section-title">Enable/Disable Services</div>
                    <div class="section-description">Changing services may require re-authorization to request new OAuth scopes.</div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title" style="color: #d93025;">Gmail</div>
                            <div class="field-description">Read, send, search, manage emails.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle"><input type="checkbox" x-model="config.services.gmail.enabled"><span class="toggler"></span></label>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title" style="color: #4285f4;">Calendar</div>
                            <div class="field-description">Events, scheduling, availability.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle"><input type="checkbox" x-model="config.services.calendar.enabled"><span class="toggler"></span></label>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title" style="color: #0f9d58;">Drive</div>
                            <div class="field-description">Files, folders, upload, download.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle"><input type="checkbox" x-model="config.services.drive.enabled"><span class="toggler"></span></label>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title" style="color: #f4b400;">Contacts</div>
                            <div class="field-description">People, search, create.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle"><input type="checkbox" x-model="config.services.contacts.enabled"><span class="toggler"></span></label>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title" style="color: #ab47bc;">Tasks</div>
                            <div class="field-description">Task lists, to-do items.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle"><input type="checkbox" x-model="config.services.tasks.enabled"><span class="toggler"></span></label>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title" style="color: #188038;">Sheets</div>
                            <div class="field-description">Spreadsheets: create, read/write cells, append rows. Listing spreadsheets requires Drive to also be enabled.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle"><input type="checkbox" x-model="config.services.sheets.enabled"><span class="toggler"></span></label>
                        </div>
                    </div>
                </div>

                <!-- Gmail Tab -->
                <div x-show="activeTab === 'gmail'">
                    <div class="section-title">Gmail Settings</div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Max Results per Query</div>
                            <div class="field-description">Maximum number of results returned per search (1-100).</div>
                        </div>
                        <div class="field-control">
                            <input type="number" min="1" max="100" x-model.number="config.gmail.max_results">
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Include spam and trash</div>
                            <div class="field-description">Include spam and trash folders in search results.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle"><input type="checkbox" x-model="config.gmail.include_spam_trash"><span class="toggler"></span></label>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Excluded Labels</div>
                            <div class="field-description">Labels to exclude from results, one per line.</div>
                        </div>
                        <div class="field-control">
                            <textarea rows="2"
                                :value="(config.gmail.exclude_labels || []).join('\n')"
                                @input="config.gmail.exclude_labels = $event.target.value.split('\n').map(s => s.trim()).filter(Boolean)"
                                placeholder="SPAM&#10;TRASH"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Calendar Tab -->
                <div x-show="activeTab === 'calendar'">
                    <div class="section-title">Calendar Settings</div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Timezone</div>
                            <div class="field-description">Default timezone for calendar events.</div>
                        </div>
                        <div class="field-control">
                            <select x-model="config.calendar.timezone">
                                <option value="America/New_York">America/New_York (Eastern)</option>
                                <option value="America/Chicago">America/Chicago (Central)</option>
                                <option value="America/Denver">America/Denver (Mountain)</option>
                                <option value="America/Los_Angeles">America/Los_Angeles (Pacific)</option>
                                <option value="America/Anchorage">America/Anchorage (Alaska)</option>
                                <option value="Pacific/Honolulu">Pacific/Honolulu (Hawaii)</option>
                                <option value="Europe/London">Europe/London (GMT)</option>
                                <option value="Europe/Berlin">Europe/Berlin (CET)</option>
                                <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
                                <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
                                <option value="Australia/Sydney">Australia/Sydney (AEST)</option>
                                <option value="UTC">UTC</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Default Calendar ID</div>
                            <div class="field-description">Calendar to use by default (usually "primary").</div>
                        </div>
                        <div class="field-control">
                            <input type="text" x-model="config.calendar.calendar_id" placeholder="primary">
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Max Results</div>
                            <div class="field-description">Maximum events returned per query (1-100).</div>
                        </div>
                        <div class="field-control">
                            <input type="number" min="1" max="100" x-model.number="config.calendar.max_results">
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Default Duration (minutes)</div>
                            <div class="field-description">Default event duration when not specified (5-480).</div>
                        </div>
                        <div class="field-control">
                            <input type="number" min="5" max="480" x-model.number="config.calendar.default_duration_minutes">
                        </div>
                    </div>
                </div>

                <!-- Drive Tab -->
                <div x-show="activeTab === 'drive'">
                    <div class="section-title">Drive Settings</div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Default Folder ID</div>
                            <div class="field-description">Default folder for uploads. Leave empty for root.</div>
                        </div>
                        <div class="field-control">
                            <input type="text" x-model="config.drive.default_folder" placeholder="Leave empty for root">
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Max Upload Size (MB)</div>
                            <div class="field-description">Maximum file upload size in megabytes (1-5120).</div>
                        </div>
                        <div class="field-control">
                            <input type="number" min="1" max="5120" x-model.number="config.drive.max_upload_mb">
                        </div>
                    </div>
                </div>

                <!-- Security Tab -->
                <div x-show="activeTab === 'security'">
                    <div class="section-title">Security Settings</div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Max Attachment Size (MB)</div>
                            <div class="field-description">Maximum email attachment size (1-25).</div>
                        </div>
                        <div class="field-control">
                            <input type="number" min="1" max="25" x-model.number="config.security.max_attachment_size_mb">
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Max Attendees per Event</div>
                            <div class="field-description">Maximum attendees allowed per calendar event (1-200).</div>
                        </div>
                        <div class="field-control">
                            <input type="number" min="1" max="200" x-model.number="config.security.max_attendees">
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Allowed Recipients</div>
                            <div class="field-description">Restrict email sending to these addresses. Leave empty to allow all.</div>
                        </div>
                        <div class="field-control">
                            <textarea rows="3"
                                :value="(config.security.allowed_recipients || []).join('\n')"
                                @input="config.security.allowed_recipients = $event.target.value.split('\n').map(s => s.trim()).filter(Boolean)"
                                placeholder="Leave empty to allow all recipients"></textarea>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Allowed Calendars</div>
                            <div class="field-description">Restrict calendar access to these IDs. Leave empty to allow all.</div>
                        </div>
                        <div class="field-control">
                            <textarea rows="2"
                                :value="(config.security.allowed_calendars || []).join('\n')"
                                @input="config.security.allowed_calendars = $event.target.value.split('\n').map(s => s.trim()).filter(Boolean)"
                                placeholder="Leave empty to allow all calendars"></textarea>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <div class="field-title">Sanitize email content</div>
                            <div class="field-description">Strip tracking pixels and known injection patterns from emails.</div>
                        </div>
                        <div class="field-control">
                            <label class="toggle"><input type="checkbox" x-model="config.security.sanitize_content"><span class="toggler"></span></label>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</body>
</html>
